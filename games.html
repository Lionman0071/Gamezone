</head>
<body>
<header class="navbar">
<a class="logo" href="index.html">GAME<span>ZONE</span></a>
<nav class="menu">
<a href="index.html">หน้าแรก</a>
<a class="active" href="games.html">คลังเกม</a>
<a href="ranking.html">จัดอันดับเกม</a>
</nav>

<section class="page-header">
<p>GAMES LIBRARY</p>
<h1>
    <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: text-bottom;">
        <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="2" y1="20" x2="22" y2="20"/>
    </svg>
    คลังเกมทั้งหมด
</h1>
<span>รวมเกม PC และ Console น่าเล่นที่คัดมาแล้ว</span>
</section>

<section class="section">
<div class="search-box">
<input id="gameSearch" placeholder="🔎 ค้นหาชื่อเกม..." type="text"/>
</div>

<div class="filter-buttons">
<button class="game-filter active" data-filter="all">ทั้งหมด</button>
<button class="game-filter" data-filter="racing">RACING</button>
<button class="game-filter" data-filter="action">ACTION</button>
<button class="game-filter" data-filter="simulation">SIMULATION</button>
<button class="game-filter" data-filter="rpg">RPG</button>
<button class="game-filter" data-filter="adventure">ADVENTURE</button>
<button class="game-filter" data-filter="sport">SPORT</button>
</div>

<div class="game-grid" id="gamesLibrary">
</div>
<p class="no-result" id="noGameResult">ไม่พบเกมที่ค้นหา</p>
</section>

<footer>
<div class="footer-logo">GAME<span>ZONE</span></div>
<p>เว็บไซต์คลังข้อมูลเกม PC และ Console</p>
<p class="copyright">© 2026 GAMEZONE. All Rights Reserved.</p>
</footer>

<script src="games-data.js"></script>
<script>
document.addEventListener("gamesDataLoaded", () => {
    const grid = document.getElementById("gamesLibrary");
    const gameSearch = document.getElementById("gameSearch");
    const gameFilters = document.querySelectorAll(".game-filter");
    let currentFilter = "all";
    
    const gamesArray = Object.entries(gamesDatabase).map(([id, game]) => ({ id, ...game }));

    function renderGamesPage() {
    const grid = document.getElementById("gamesLibrary");
    const gameSearch = document.getElementById("gameSearch");
    const gameFilters = document.querySelectorAll(".game-filter");
    let currentFilter = "all";
    
    const gamesArray = Object.entries(window.gamesDatabase).map(([id, game]) => ({ id, ...game }));

    function renderGames() {
        const search = gameSearch.value.toLowerCase();
        
        const filteredGames = gamesArray.filter(game => {
            const matchSearch = game.name.toLowerCase().includes(search);
            // หมวดหมู่จาก IGDB จะยาว เช่น "ROLE-PLAYING (RPG)" เราดักแค่ให้มันมีคำว่า rpg ก็พอ
            const matchCategory = currentFilter === "all" || game.category.toLowerCase().includes(currentFilter);
            return matchSearch && matchCategory;
        });

        if (filteredGames.length > 0) {
            grid.innerHTML = filteredGames.map((game, index) => {
                const delay = index * 0.05;
                return `
                <a class="game-card" style="animation-delay: ${delay}s;" href="game-detail.html?game=${game.id}">
                    <div class="game-cover">
                        <img src="${game.image}" alt="${game.name}">
                    </div>
                    <div class="game-info">
                        <span class="tag">${game.category}</span>
                        <h3>${game.name}</h3>
                        <p>${game.description}</p>
                    </div>
                </a>
                `;
            }).join('');
            document.getElementById("noGameResult").style.display = "none";
        } else {
            grid.innerHTML = "";
            document.getElementById("noGameResult").style.display = "block";
        }
    }

    renderGames();

    gameSearch.addEventListener("input", renderGames);
    gameFilters.forEach(button => {
        button.addEventListener("click", function() {
            gameFilters.forEach(btn => btn.classList.remove("active"));
            this.classList.add("active");
            currentFilter = this.dataset.filter;
            renderGames();
        });
    });
}

if (window.isGamesDataLoaded) {
    renderGamesPage();
} else {
    document.addEventListener("gamesDataLoaded", renderGamesPage);
}
});
</script>
<script src="chatbot-widget.js"></script>
<script src="chatbot.js"></script>
</body>
</html>
