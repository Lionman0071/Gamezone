    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align: middle; margin-right: 4px;"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="2" y1="20" x2="22" y2="20"/></svg> PC
</button>

    <!-- ไอคอนจำลองจอยสติ๊กสำหรับ Console (เผื่ออนาคตเพิ่มเกมคอนโซล) -->

</div>
</section>

<footer>
<div class="footer-logo">GAME<span>ZONE</span></div>

<script src="games-data.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
    const list = document.getElementById("rankingList");
    const tabs = document.querySelectorAll(".ranking-tab");

    // เรียงคะแนนจากมากไปน้อย แล้วตัดมาแค่ 10 อันดับแรก
    const top10Games = Object.entries(gamesDatabase)
        .map(([id, game]) => ({ id, ...game }))
        .sort((a, b) => parseFloat(b.score) - parseFloat(a.score))
        .slice(0, 10);

    function renderList(filter) {
        let rank = 1;
        list.innerHTML = top10Games
            .filter(item => filter === 'all' || item.platform.toLowerCase() === filter)
            .map(item => `
                <a class="ranking-item" data-platform="${item.platform.toLowerCase()}" href="game-detail.html?game=${item.id}">
                    <div class="rank-number">${rank++}</div>
                    <div class="rank-icon">
                        <img src="${item.image}" alt="${item.name}">
                    </div>
                    <div class="rank-info">
                        <span class="tag">${item.platform.toUpperCase()}</span>
                        <h3>${item.name}</h3>
                        <p>${item.category} / ${item.developer}</p>
                    </div>
                    <div class="score">
                        <strong>${item.score}</strong><span>/10</span>
                    </div>
                </a>
            `).join('');
    }

    renderList('all');

    tabs.forEach(tab => {
        tab.addEventListener("click", function() {
            tabs.forEach(t => t.classList.remove("active"));
            this.classList.add("active");
            renderList(this.dataset.platform);
        });
    });
});
</script>
<script src="chatbot-widget.js"></script>

</body>
